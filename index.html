
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>My Progress Tracker</title>

  <style>
    body {
      background-color: #fff7fb;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px 20px;
      color: #51445a;
    }

    h1 {
      color: #d878a4;
      font-size: 36px;
    }

    .card {
      background-color: white;
      border: 2px solid #f5d6e5;
      border-radius: 18px;
      padding: 24px;
      max-width: 400px;
      margin: 30px auto;
      box-shadow: 0 4px 12px #f5d6e555;
    }

    .number {
      color: #d878a4;
      font-size: 32px;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <h1>My Progress Tracker 🌸</h1>
  <p>My personal health & fitness dashboard</p>

  <div class="card">
    <h2>Welcome!</h2>
    <p>Your progress tracking journey starts here.</p>
    <p class="number">✨</p>
  </div>
</body>
</html>
